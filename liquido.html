<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Gerencial · Control Shell Constituyentes</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #090d16;
    --card: #111625;
    --card-border: #1f2638;
    --shell-red: #e51225;
    --shell-yellow: #fecb00;
    --text-primary: #f3f4f6;
  }
  html, body { background-color: var(--bg); color: var(--text-primary); font-family: system-ui, -apple-system, sans-serif; }
  .card { background-color: var(--card); border: 1px solid var(--card-border); border-radius: 12px; }
  .live-dot { width: 8px; height: 8px; border-radius: 9999px; background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  
  .pill { background: #1a2333; color: #9ca3af; border: 1px solid #2d394f; transition: all 0.2s; cursor: pointer; font-size: 11px; font-weight: 600; }
  .pill:hover { border-color: #4b5563; color: #fff; }
  .pill.active-gnc { background: var(--shell-red); color: #fff; border-color: #ff3344; box-shadow: 0 0 10px rgba(229,18,37,0.4); }
  .pill.active-liq { background: #d97706; color: #fff; border-color: #f59e0b; box-shadow: 0 0 10px rgba(217,119,6,0.4); }
  .pill.active-teal { background: #0d9488; color: #fff; border-color: #14b8a6; box-shadow: 0 0 10px rgba(20,184,166,0.3); }
</style>
</head>
<body class="min-h-screen p-4 md:p-6">

<div class="max-w-[1500px] mx-auto">

  <!-- ENCABEZADO -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6 border-b border-gray-800 pb-5">
    <div class="flex items-center gap-3">
      <div id="brandBadge" class="w-10 h-10 rounded-lg bg-amber-600/10 border border-amber-500/30 flex items-center justify-center font-black text-amber-400 text-sm tracking-tighter">SHELL</div>
      <div>
        <h1 class="text-lg font-bold tracking-tight" id="lblMainHeading">Dashboard de Ventas · Líquidos y Shop</h1>
        <p class="text-xs text-gray-400" id="lblUpdated">Sincronizando registros...</p>
      </div>
    </div>
    <div class="flex items-center gap-4 text-xs">
      <div class="flex items-center gap-2 text-gray-400"><span class="live-dot"></span> Filtro de Consistencia Activo</div>
      <button id="btnRefresh" class="bg-gray-800 border border-gray-700 hover:border-gray-500 px-3 py-1.5 rounded-md transition text-gray-200">Sincronizar Planilla</button>
    </div>
  </div>

  <!-- BARRA DE FILTROS -->
  <div class="card p-4 mb-6 space-y-3">
    <div class="flex flex-col sm:flex-row sm:items-center gap-2">
      <span class="text-xs font-semibold text-gray-400 w-24">PERÍODO / MES:</span>
      <div id="filterMonths" class="flex flex-wrap gap-1.5"></div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs font-semibold text-gray-400 w-24">TURNO:</span>
      <div id="filterTurns" class="flex flex-wrap gap-1.5">
        <button class="pill px-3 py-1 rounded-full active-liq" data-turn="Todos">Todos</button>
        <button class="pill px-3 py-1 rounded-full" data-turn="MAÑANA">Mañana</button>
        <button class="pill px-3 py-1 rounded-full" data-turn="TARDE">Tarde</button>
        <button class="pill px-3 py-1 rounded-full" data-turn="NOCHE">Noche</button>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs font-semibold text-gray-400 w-24">PLAYERO:</span>
      <div id="filterWorkers" class="flex flex-wrap gap-1.5">
        <button class="pill px-3 py-1 rounded-full active-teal" data-worker="Todos">Todos</button>
      </div>
    </div>
  </div>

  <!-- METRICAS -->
  <div id="metricsGrid" class="grid grid-cols-2 lg:grid-cols-6 gap-4 mb-6"></div>

  <!-- AVISO AUDITORIA -->
  <div class="card p-3 border-yellow-500/20 bg-yellow-500/5 mb-6 text-xs flex items-center gap-2 text-gray-300">
    <span>🛡️</span>
    <p id="lblAlert">Procesando matriz de datos...</p>
  </div>

  <!-- GRAFICOS FILA 1 -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
    <div class="card p-4 lg:col-span-2">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-300" id="lblChartMainTitle">Evolución</h3>
        <span class="text-[10px] bg-gray-800 text-yellow-400 px-2 py-0.5 rounded-full">AUDITADO</span>
      </div>
      <div class="h-64"><canvas id="chartMain"></canvas></div>
    </div>
    <div class="card p-4">
      <h3 class="text-xs font-bold uppercase tracking-wider text-gray-300 mb-4">Distribución por Turno</h3>
      <div class="h-64"><canvas id="chartTurns"></canvas></div>
    </div>
  </div>

  <!-- GRAFICOS FILA 2 -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="card p-4 lg:col-span-2">
      <h3 class="text-xs font-bold uppercase tracking-wider text-gray-300 mb-4" id="lblRankingTitle">Performance</h3>
      <div class="h-64"><canvas id="chartRanking"></canvas></div>
    </div>
    <div class="card p-4">
      <h3 class="text-xs font-bold uppercase tracking-wider text-gray-300 mb-4" id="lblChartSecTitle">Ventas</h3>
      <div class="h-64"><canvas id="chartSecondary"></canvas></div>
    </div>
  </div>

</div>

<script>
const BASE_URL = "https://docs.google.com/spreadsheets/d/1Mi9g0qnBZRj70IdQl_6M1JxjMGRnyw1wOCh56D7cv64/gviz/tq?tqx=out:csv";
const URL_LIQ = BASE_URL + "&sheet=Hoja%202%20liq";

let rawLiqData = [];
let activeFilters = { month: 'CURSO', turn: 'Todos', worker: 'Todos' };
let charts = {};
let currentMonthLabelGlobal = "";

const COLORS = {
  orange: '#ea580c', yellow: '#fecb00', teal: '#0d9488',
  chartSet: ['#f59e0b', '#fecb00', '#10b981', '#8b5cf6', '#06b6d4', '#ea580c', '#14b8a6']
};

async function init() {
  setupEventListeners();
  await fetchData();
}

async function fetchData() {
  try {
    const resLiq = await fetch(URL_LIQ + "&cb=" + Date.now()).then(r => r.text());
    rawLiqData = Papa.parse(resLiq.trim(), { skipEmptyLines: true }).data;

    // Remover fila de encabezados si existe texto en lugar de fecha
    if (rawLiqData.length && isNaN(parseRowDate(rawLiqData[0][0]).getTime())) {
      rawLiqData.shift(); 
    }

    buildMonthFilters();
    updateDashboard();
    
    const now = new Date();
    document.getElementById('lblUpdated').textContent = `Última sincronización: ${now.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'})}`;
  } catch (err) {
    console.error("Error cargando datos:", err);
  }
}

function parseRowDate(str) {
  if (!str) return new Date(NaN);
  const cleanStr = str.trim().replace(/["']/g, '');
  const parts = cleanStr.split(/[\/\-]/);
  
  if (parts.length === 3) {
    let day, month, year;
    if (parts[0].length === 4) {
      year = parseInt(parts[0], 10);
      month = parseInt(parts[1], 10) - 1;
      day = parseInt(parts[2], 10);
    } else {
      day = parseInt(parts[0], 10);
      month = parseInt(parts[1], 10) - 1;
      year = parseInt(parts[2], 10);
      if (year < 100) year += 2000;
    }
    return new Date(year, month, day);
  }
  return new Date(NaN);
}

// LIMPIEZA MATEMÁTICA: Remueve de raíz los textos "Lt", "Lts" o "$"
function num(v) {
  if (!v) return 0;
  const cleanStr = String(v)
    .replace(/[^\d.,-]/g, "") 
    .replace(",", ".");       
  const n = parseFloat(cleanStr);
  return isNaN(n) ? 0 : n;
}

function getClosedDaysMap(dataSrc) {
  const dayTurns = {};
  dataSrc.forEach(r => {
    if (!r[0] || !r[1]) return;
    const f = r[0].trim();
    const t = r[1].toUpperCase().trim();
    if (t==='MAÑANA' || t==='TARDE' || t==='NOCHE') {
      if (!dayTurns[f]) dayTurns[f] = new Set();
      dayTurns[f].add(t);
    }
  });
  const closedMap = {};
  for (const date in dayTurns) {
    closedMap[date] = true;
  }
  return closedMap;
}

function getProrrateoMap(dataSrc, closedMap) {
  const prorrateo = {};
  dataSrc.forEach(r => {
    if (!r[0] || !r[1] || !r[2]) return;
    const f = r[0].trim();
    if (!closedMap[f]) return; 
    const t = r[1].toUpperCase().trim();
    const p = r[2].trim();
    if (p !== "") {
      const key = `${f}_${t}`;
      if (!prorrateo[key]) prorrateo[key] = new Set();
      prorrateo[key].add(p);
    }
  });
  return prorrateo;
}

function buildMonthFilters() {
  const monthsDiv = document.getElementById('filterMonths');
  monthsDiv.innerHTML = '';
  
  const closedMap = getClosedDaysMap(rawLiqData);
  const uniqueMonths = new Set();
  let latestDate = null;
  
  rawLiqData.forEach(r => {
    if (!r[0]) return;
    const d = parseRowDate(r[0]);
    if (!isNaN(d.getTime()) && closedMap[r[0].trim()]) {
      if (d.getFullYear() < 2026 || (d.getFullYear() === 2026 && d.getMonth() < 4)) return;
      let label = d.toLocaleDateString('es-AR', { month: 'short', year: '2-digit' }).replace('.', '').trim().toUpperCase();
      uniqueMonths.add(label);
      if (!latestDate || d > latestDate) latestDate = d;
    }
  });

  if (latestDate) {
    currentMonthLabelGlobal = latestDate.toLocaleDateString('es-AR', { month: 'short', year: '2-digit' }).replace('.', '').trim().toUpperCase();
  } else {
    currentMonthLabelGlobal = "JUL 26";
  }

  const activeClass = 'active-liq';

  const btnCurso = document.createElement('button');
  btnCurso.className = `pill px-3 py-1 rounded-full ${activeFilters.month === 'CURSO' ? activeClass : ''}`;
  btnCurso.textContent = `MES EN CURSO (${currentMonthLabelGlobal})`;
  btnCurso.onclick = () => { selectFilter('month', 'CURSO'); };
  monthsDiv.appendChild(btnCurso);

  const btnAll = document.createElement('button');
  btnAll.className = `pill px-3 py-1 rounded-full ${activeFilters.month === 'TODOS' ? activeClass : ''}`;
  btnAll.textContent = "HISTORIAL (POST MAYO 2026)";
  btnAll.onclick = () => { selectFilter('month', 'TODOS'); };
  monthsDiv.appendChild(btnAll);

  Array.from(uniqueMonths).sort((a,b) => b.localeCompare(a)).forEach(m => {
    const btn = document.createElement('button');
    btn.className = `pill px-3 py-1 rounded-full ${activeFilters.month === m ? activeClass : ''}`;
    btn.textContent = m;
    btn.onclick = () => { selectFilter('month', m); };
    monthsDiv.appendChild(btn);
  });
}

function buildWorkerFilters(filteredRows) {
  const workersDiv = document.getElementById('filterWorkers');
  const currentSelection = activeFilters.worker;
  workersDiv.innerHTML = '';

  const workers = new Set();
  filteredRows.forEach(r => {
    if (r[2] && r[2].trim()) workers.add(r[2].trim());
  });

  const btnAll = document.createElement('button');
  btnAll.className = `pill px-3 py-1 rounded-full ${currentSelection === 'Todos' ? 'active-teal' : ''}`;
  btnAll.textContent = "Todos";
  btnAll.onclick = () => { selectFilter('worker', 'Todos'); };
  workersDiv.appendChild(btnAll);

  Array.from(workers).sort().forEach(w => {
    const btn = document.createElement('button');
    btn.className = `pill px-3 py-1 rounded-full ${currentSelection === w ? 'active-teal' : ''}`;
    btn.textContent = w;
    btn.onclick = () => { selectFilter('worker', w); };
    workersDiv.appendChild(btn);
  });
}

function selectFilter(type, value) {
  activeFilters[type] = value;
  if (type === 'month') buildMonthFilters();
  if (type === 'turn') {
    document.querySelectorAll('#filterTurns .pill').forEach(b => {
      b.classList.toggle('active-liq', b.getAttribute('data-turn') === value);
    });
  }
  updateDashboard();
}

function updateDashboard() {
  const closedMap = getClosedDaysMap(rawLiqData);
  const prorrateoMap = getProrrateoMap(rawLiqData, closedMap);

  let baseRows = rawLiqData.filter(r => {
    if (!r[0] || !r[1] || String(r[0]).trim() === "") return false; // Salteo automático de baches vacíos (ej: 03-07)
    const f = r[0].trim();
    
    const d = parseRowDate(f);
    if (isNaN(d.getTime())) return false;
    if (d.getFullYear() < 2026 || (d.getFullYear() === 2026 && d.getMonth() < 4)) return false;
    
    if (activeFilters.month === 'TODOS') return true;
    let label = d.toLocaleDateString('es-AR', { month: 'short', year: '2-digit' }).replace('.', '').trim().toUpperCase();
    if (activeFilters.month === 'CURSO') return label === currentMonthLabelGlobal;
    return label === activeFilters.month.toUpperCase();
  });

  buildWorkerFilters(baseRows);

  let displayRows = baseRows;
  if (activeFilters.turn !== 'Todos') {
    displayRows = displayRows.filter(r => r[1] && r[1].toUpperCase().trim() === activeFilters.turn.toUpperCase());
  }

  const modoTexto = activeFilters.month === 'CURSO' ? `MES EN CURSO (${currentMonthLabelGlobal})` : (activeFilters.month === 'TODOS' ? 'HISTORIAL CONSOLIDADO' : `PERÍODO ${activeFilters.month}`);
  document.getElementById('lblAlert').textContent = `Auditoría Interna Shell: ${modoTexto} | Mapeo indexado por posición de celda activo.`;

  renderLiquidosDashboard(displayRows, prorrateoMap);
}

function renderLiquidosDashboard(displayRows, prorrateoMap) {
  let totalLitros = 0, heladera = 0, varios = 0, aceite = 0;
  const uniqueDays = new Set();

  displayRows.forEach(r => {
    const f = r[0].trim();
    const t = r[1].toUpperCase().trim();
    const p = r[2].trim();
    const key = `${f}_${t}`;
    const numPlayerosEnTurno = prorrateoMap[key] ? prorrateoMap[key].size : 1;

    if (activeFilters.worker !== 'Todos' && p !== activeFilters.worker) return;
    const factor = (activeFilters.worker !== 'Todos') ? (1 / numPlayerosEnTurno) : 1;

    if (activeFilters.worker !== 'Todos') {
      heladera += num(r[4]) * factor; // Columna E (Heladera)
      varios += num(r[5]) * factor;   // Columna F (Varios)
      aceite += num(r[6]) * factor;   // Columna G (Lubricantes LTS)
      totalLitros += num(r[11]) * factor; // Columna L (Total Litros/Venta Turno)
    }
    uniqueDays.add(f);
  });

  if (activeFilters.worker === 'Todos') {
    totalLitros = 0; heladera = 0; varios = 0; aceite = 0;
    const yaSumado = new Set();
    displayRows.forEach(r => {
      const idUnicoFila = `${r[0]}_${r[1]}_${r[2]}_${r[11]}`;
      const key = `${r[0].trim()}_${r[1].toUpperCase().trim()}`;
      const divisor = prorrateoMap[key] ? prorrateoMap[key].size : 1;

      if (!yaSumado.has(idUnicoFila)) {
        yaSumado.add(idUnicoFila);
        heladera += num(r[4]) / divisor;
        varios += num(r[5]) / divisor;
        aceite += num(r[6]) / divisor; 
        totalLitros += num(r[11]) / divisor;
      }
    });
  }

  const cantDias = uniqueDays.size || 1;
  const promedioLts = totalLitros / cantDias;

  const grid = document.getElementById('metricsGrid');
  grid.innerHTML = `
    <div class="card p-4 border-l-4 border-amber-500">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">LTS COMBUSTIBLE</p>
      <p class="text-xl font-black text-amber-500 mt-1">${Math.round(totalLitros).toLocaleString('es-AR')} L</p>
    </div>
    <div class="card p-4 border-l-4 border-red-500">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">TIENDA HELADERA</p>
      <p class="text-xl font-black text-red-500 mt-1">$ ${Math.round(heladera).toLocaleString('es-AR')}</p>
    </div>
    <div class="card p-4 border-l-4 border-yellow-500">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">VARIOS SHOP</p>
      <p class="text-xl font-black text-yellow-500 mt-1">$ ${Math.round(varios).toLocaleString('es-AR')}</p>
    </div>
    <div class="card p-4 border-l-4 border-teal-500">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">LUBRICANTES LIQ.</p>
      <p class="text-xl font-black text-teal-400 mt-1">${Math.round(aceite).toLocaleString('es-AR')} L</p>
    </div>
    <div class="card p-4 border-l-4 border-gray-600">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">DÍAS LIQUIDADOS</p>
      <p class="text-xl font-black text-gray-300 mt-1">${cantDias}</p>
    </div>
    <div class="card p-4">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">PROM. JORNADA</p>
      <p class="text-xl font-black text-purple-400 mt-1">${Math.round(promedioLts).toLocaleString('es-AR')} L</p>
    </div>
  `;

  document.getElementById('lblChartMainTitle').textContent = "Evolución Combustibles Líquidos (Litros)";
  document.getElementById('lblRankingTitle').textContent = "Despacho Equitativo por Playero (Litros)";
  document.getElementById('lblChartSecTitle').textContent = "Ingresos del Shop (Heladera $)";

  const daysMap = {};
  displayRows.forEach(r => {
    const f = r[0].trim();
    const t = r[1].toUpperCase().trim();
    if (activeFilters.worker !== 'Todos' && r[2].trim() !== activeFilters.worker) return;
    
    const key = `${f}_${t}`;
    const numPlayerosEnTurno = prorrateoMap[key] ? prorrateoMap[key].size : 1;
    daysMap[f] = (daysMap[f] || 0) + (num(r[11]) / numPlayerosEnTurno);
  });
  const labelsDates = Object.keys(daysMap).sort();
  const valuesLts = labelsDates.map(k => daysMap[k]);

  renderMainLineChart(labelsDates, valuesLts, "Litros Combustible", promedioLts, '#f59e0b');
  renderTurnsChart(displayRows, 11, prorrateoMap); 
  renderRankingChart(displayRows, 11, prorrateoMap); 
  renderSecondaryBarChart(displayRows, 4, "Heladera $", prorrateoMap); 
}

function destroyChart(id) { if (charts[id]) { charts[id].destroy(); } }

const baseChartOptions = {
  responsive: true, maintainAspectRatio: false,
  plugins: { legend: { labels: { color: '#9ca3af', font: { size: 10 } } } },
  scales: {
    x: { ticks: { color: '#6b7280', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.01)' } },
    y: { ticks: { color: '#6b7280', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.02)' } }
  }
};

function renderMainLineChart(labels, dataValues, datasetLabel, average, colorGlow) {
  destroyChart('main');
  const ctx = document.getElementById('chartMain').getContext('2d');
  charts.main = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        { label: datasetLabel, data: dataValues, borderColor: colorGlow, backgroundColor: 'rgba(245,158,11,0.02)', fill: true, tension: 0.1, borderWidth: 2 },
        { label: 'Media Período', data: dataValues.map(() => average), borderColor: '#fecb00', borderDash: [4, 4], pointRadius: 0, borderWidth: 1 }
      ]
    },
    options: baseChartOptions
  });
}

function renderTurnsChart(rows, dataColIdx, prorrateoMap) {
  destroyChart('turns');
  const turnsMap = { 'MAÑANA': 0, 'TARDE': 0, 'NOCHE': 0 };
  
  rows.forEach(r => {
    const f = r[0].trim();
    const t = r[1].toUpperCase().trim();
    if (activeFilters.worker !== 'Todos' && r[2].trim() !== activeFilters.worker) return;
    
    const key = `${f}_${t}`;
    const numPlayerosEnTurno = prorrateoMap[key] ? prorrateoMap[key].size : 1;
    if (turnsMap[t] !== undefined) turnsMap[t] += num(r[dataColIdx]) / numPlayerosEnTurno;
  });

  const ctx = document.getElementById('chartTurns').getContext('2d');
  charts.turns = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: Object.keys(turnsMap),
      datasets: [{
        data: Object.values(turnsMap),
        backgroundColor: ['#e51225', '#fecb00', '#4b5563'],
        borderWidth: 0
      }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#9ca3af', font: { size: 10 } } } } }
  });
}

function renderRankingChart(rows, dataColIdx, prorrateoMap) {
  destroyChart('ranking');
  const rank = {};
  
  rows.forEach(r => {
    const f = r[0].trim();
    const t = r[1].toUpperCase().trim();
    const p = (r[2] || '').trim();
    if (!p) return;
    
    const key = `${f}_${t}`;
    const numPlayerosEnTurno = prorrateoMap[key] ? prorrateoMap[key].size : 1;
    const valorProrrateado = num(r[dataColIdx]) / numPlayerosEnTurno;

    if (activeFilters.worker !== 'Todos' && p !== activeFilters.worker) return;
    rank[p] = (rank[p] || 0) + valorProrrateado;
  });

  const sorted = Object.entries(rank).sort((a, b) => b[1] - a[1]);
  const ctx = document.getElementById('chartRanking').getContext('2d');
  charts.ranking = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: sorted.map(e => e[0]),
      datasets: [{
        label: 'Litros Asignados',
        data: sorted.map(e => Math.round(e[1])),
        backgroundColor: COLORS.chartSet,
        borderRadius: 4
      }]
    },
    options: { indexAxis: 'y', ...baseChartOptions, plugins: { legend: { display: false } } }
  });
}

function renderSecondaryBarChart(rows, dataColIdx, labelName, prorrateoMap) {
  destroyChart('secondary');
  const turnsMap = { 'MAÑANA': 0, 'TARDE': 0, 'NOCHE': 0 };
  
  rows.forEach(r => {
    const f = r[0].trim();
    const t = r[1].toUpperCase().trim();
    if (activeFilters.worker !== 'Todos' && r[2].trim() !== activeFilters.worker) return;
    
    const key = `${f}_${t}`;
    const numPlayerosEnTurno = prorrateoMap[key] ? prorrateoMap[key].size : 1;
    if (turnsMap[t] !== undefined) turnsMap[t] += num(r[dataColIdx]) / numPlayerosEnTurno;
  });

  const ctx = document.getElementById('chartSecondary').getContext('2d');
  charts.secondary = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: Object.keys(turnsMap),
      datasets: [{
        label: labelName,
        data: Object.values(turnsMap),
        backgroundColor: ['#e51225', '#fecb00', '#4b5563'],
        borderRadius: 4
      }]
    },
    options: { ...baseChartOptions, plugins: { legend: { display: false } } }
  });
}

function setupEventListeners() {
  document.getElementById('btnRefresh').addEventListener('click', fetchData);
}

window.onload = init;
</script>
</body>
</html>
