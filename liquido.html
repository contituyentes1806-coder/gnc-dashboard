<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Ventas - Líquidos y Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-principal: #0d1117;
            --bg-tarjeta: #161b22;
            --borde-tarjeta: #30363d;
            --texto-principal: #c9d1d9;
            --texto-secundario: #8b949e;
            --color-combustible: #ff9f43;
            --color-heladera: #ff4d4d;
            --color-varios: #ffb84d;
            --color-lubricantes: #2ed573;
            --color-promedio: #a55eea;
            --color-exito: #2ecc71;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--borde-tarjeta);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 500;
        }

        .header .status {
            font-size: 14px;
            color: var(--texto-secundario);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background-color: var(--color-exito);
            border-radius: 50%;
            display: inline-block;
        }

        /* Grid de Tarjetas de Control KPI */
        .grid-kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--bg-tarjeta);
            border: 1px solid var(--borde-tarjeta);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--texto-secundario);
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 28px;
            font-weight: 700;
        }

        /* Colores específicos para los valores */
        .val-combustible { color: var(--color-combustible); }
        .val-heladera { color: var(--color-heladera); }
        .val-varios { color: var(--color-varios); }
        .val-lubricantes { color: var(--color-lubricantes); }
        .val-promedio { color: var(--color-promedio); }

        /* Consola de Alertas */
        .alert-box {
            background-color: rgba(241, 196, 15, 0.1);
            border: 1px solid #f1c40f;
            color: #f1c40f;
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 13px;
            margin-bottom: 25px;
            display: none; /* Se muestra dinámicamente si hay baches */
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <div>
                <h1>Dashboard de ventas &middot; Líquidos y Shop</h1>
                <p style="margin: 5px 0 0 0; color: var(--texto-secundario); font-size: 14px;">Estación de Servicio Constituyentes 1806</p>
            </div>
            <div class="status">
                <span class="status-indicator"></span> En vivo / Sincronizado
            </div>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <div class="grid-kpis">
            
            <div class="card" style="border-left: 4px solid var(--color-combustible);">
                <div class="card-title">Lts Combustible Acumulados</div>
                <div id="kpiCombustible" class="card-value val-combustible">0 L</div>
            </div>

            <div class="card" style="border-left: 4px solid var(--color-heladera);">
                <div class="card-title">Tienda Heladera</div>
                <div id="kpiHeladera" class="card-value val-heladera">$ 0</div>
            </div>

            <div class="card" style="border-left: 4px solid var(--color-varios);">
                <div class="card-title">Varios Shop</div>
                <div id="kpiVarios" class="card-value val-varios">$ 0</div>
            </div>

            <div class="card" style="border-left: 4px solid var(--color-lubricantes);">
                <div class="card-title">Lubricantes Liq.</div>
                <div id="kpiLubricantes" class="card-value val-lubricantes">0 L</div>
            </div>

            <div class="card" style="border-left: 4px solid var(--texto-principal);">
                <div class="card-title">Días Consolidados</div>
                <div id="kpiDias" class="card-value">0</div>
            </div>

            <div class="card" style="border-left: 4px solid var(--color-promedio);">
                <div class="card-title">Prom. Despacho Diario</div>
                <div id="kpiPromedio" class="card-value val-promedio">0 L</div>
            </div>

        </div>

    </div>

    <script>
        /**
         * Parsea y limpia de forma segura cualquier cadena de texto proveniente de las celdas.
         * Quita letras ("Lt", "Lts", "$"), espacios y normaliza las comas decimales.
         */
        function limpiarYConvertirNumero(valorRaw) {
            if (!valorRaw) return 0;
            let stringLimpio = String(valorRaw)
                .replace(/[^\d.,-]/g, "") // Remueve todo lo que no sea número, punto, coma o signo menos
                .replace(",", ".");       // Convierte formato de coma decimal a punto estándar
            let numero = parseFloat(stringLimpio);
            return isNaN(numero) ? 0 : numero;
        }

        /**
         * Procesa el array de filas de la Planilla Maestra (Hoja 2 liq).
         * Filtra baches vacíos y previene errores de formato de texto o concatenación.
         */
        function procesarDatosPlanilla(filasPlanilla) {
            let acumuladorLitros = 0;
            let acumuladorHeladera = 0;
            let acumuladorVarios = 0;
            let acumuladorLubricantes = 0;
            
            // Set dinámico para contar los días reales únicos sin duplicar por turnos compartidos
            let diasContados = new Set(); 
            let alertasBaches = [];

            filasPlanilla.forEach((fila, index) => {
                // Validación estricta: Si no tiene fecha o turno, se considera bache o celda de utilería
                if (!fila.Fecha || String(fila.Fecha).trim() === "" || !fila.Turno) {
                    if (fila.Fecha && String(fila.Fecha).trim() !== "") {
                        alertasBaches.push(`Fila ${index + 2}: Falta especificar Turno o Playero para la fecha ${fila.Fecha}.`);
                    }
                    return; // Salteo seguro de la fila sin romper la ejecución
                }

                // Extracción y limpieza matemática de los campos clave de la Hoja 2 liq
                let litros = limpiarYConvertirNumero(fila.ventaTotalComb || fila.TotalCombustible);
                let heladera = limpiarYConvertirNumero(fila.Heladera);
                let varios = limpiarYConvertirNumero(fila.Varios);
                let lubricantes = limpiarYConvertirNumero(fila.LubricantesLTS || fila.Lubricantes);

                // Acumulación sólo si la fila contiene transacciones válidas
                if (litros > 0 || heladera > 0 || varios > 0 || lubricantes > 0) {
                    acumuladorLitros += litros;
                    acumuladorHeladera += heladera;
                    acumuladorVarios += varios;
                    acumuladorLubricantes += lubricantes;
                    
                    // Almacena la fecha formateada para saber cuántos días de operación reales van consolidados
                    diasContados.add(String(fila.Fecha).trim());
                }
            });

            let totalDiasReales = diasContados.size;

            // Renderizar alertas en el Dashboard si se detectaron celdas inconsistentes
            const alertBox = document.getElementById('alertBox');
            if (alertasBaches.length > 0) {
                alertBox.innerHTML = `<strong>Aviso de Auditoría Interna:</strong> Se detectaron baches informativos o filas sin turnos asignados en la Planilla Maestra que fueron omitidos de forma segura para no alterar los gráficos.`;
                alertBox.style.display = 'block';
            } else {
                alertBox.style.display = 'none';
            }

            // Actualización de la interfaz del Front-End con formatos legibles
            document.getElementById('kpiCombustible').innerText = `${acumuladorLitros.toLocaleString('es-AR', {minimumFractionDigits: 0, maximumFractionDigits: 2})} L`;
            document.getElementById('kpiHeladera').innerText = `$ ${acumuladorHeladera.toLocaleString('es-AR', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`;
            document.getElementById('kpiVarios').innerText = `$ ${acumuladorVarios.toLocaleString('es-AR', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`;
            document.getElementById('kpiLubricantes').innerText = `${acumuladorLubricantes.toLocaleString('es-AR', {minimumFractionDigits: 0, maximumFractionDigits: 2})} L`;
            document.getElementById('kpiDias').innerText = totalDiasReales;
            
            let promedio = totalDiasReales > 0 ? (acumuladorLitros / totalDiasReales) : 0;
            document.getElementById('kpiPromedio').innerText = `${promedio.toLocaleString('es-AR', {minimumFractionDigits: 0, maximumFractionDigits: 2})} L`;
        }

        // Ejemplo de ejecución/testeo nativo (Sustituir por la llamada fetch a tu API de Google Sheets)
        // const datosEjemplo = [{ Fecha: "01-07-2026", Turno: "MAÑANA", ventaTotalComb: "2246 Lt", Heladera: "18000", Varios: "64000" }];
        // procesarDatosPlanilla(datosEjemplo);
    </script>
</body>
</html>
