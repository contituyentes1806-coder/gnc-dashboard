<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Gerencial · Control Operativo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #0b0f19;
    --card: #111827;
    --card-border: #1f2937;
    --blue: #3b82f6;
    --orange: #ea580c;
    --text-primary: #f3f4f6;
  }
  html, body { background-color: var(--bg); color: var(--text-primary); font-family: system-ui, -apple-system, sans-serif; }
  .card { background-color: var(--card); border: 1px solid var(--card-border); border-radius: 12px; }
  .live-dot { width: 8px; height: 8px; border-radius: 9999px; background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  
  .pill { background: #1f2937; color: #9ca3af; border: 1px solid #374151; transition: all 0.2s; cursor: pointer; font-size: 11px; font-weight: 500; }
  .pill:hover { border-color: #4b5563; color: #fff; }
  .pill.active-gnc { background: #2563eb; color: #fff; border-color: #3b82f6; box-shadow: 0 0 10px rgba(59,130,246,0.3); }
  .pill.active-liq { background: #ea580c; color: #fff; border-color: #f97316; box-shadow: 0 0 10px rgba(249,115,22,0.3); }
  .pill.active-teal { background: #0d9488; color: #fff; border-color: #14b8a6; box-shadow: 0 0 10px rgba(20,184,166,0.3); }
</style>
</head>
<body class="min-h-screen p-4 md:p-6">

<div class="max-w-[1500px] mx-auto">

  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6 border-b border-gray-800 pb-5">
    <div class="flex items-center gap-3">
      <div id="brandBadge" class="w-10 h-10 rounded-lg bg-blue-600/10 border border-blue-500/30 flex items-center justify-center font-bold text-blue-400 text-xs transition-colors">YPF</div>
      <div>
        <h1 class="text-lg font-bold tracking-tight" id="lblMainHeading">Dashboard de ventas · GNC</h1>
        <p class="text-xs text-gray-400" id="lblUpdated">Sincronizando planilla maestra...</p>
      </div>
    </div>
    <div class="flex items-center gap-4 text-xs">
      <div class="flex items-center gap-2 text-gray-400"><span class="live-dot"></span> Modo Auditoría Activo</div>
      <button id="btnRefresh" class="bg-gray-800 border border-gray-700 hover:border-gray-500 px-3 py-1.5 rounded-md transition text-gray-200">Sincronizar Planilla</button>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-2 mb-6">
    <button id="btnModGnc" class="py-2.5 font-bold rounded-lg text-center border transition text-xs tracking-wider uppercase bg-blue-600 border-blue-500 text-white shadow-lg shadow-blue-500/10">
      ⛽ CONTROL GNC
    </button>
    <button id="btnModLiq" class="py-2.5 font-bold rounded-lg text-center border transition text-xs tracking-wider uppercase bg-gray-800 border-gray-700 text-gray-400 hover:text-white">
      💧 CONTROL LÍQUIDOS Y SHOP
    </button>
  </div>

  <div class="card p-4 mb-6 space-y-3">
    <div class="flex flex-col sm:flex-row sm:items-center gap-2">
      <span class="text-xs font-semibold text-gray-400 w-24">PERÍODO / MES:</span>
      <div id="filterMonths" class="flex flex-wrap gap-1.5"></div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs font-semibold text-gray-400 w-24">TURNO:</span>
      <div id="filterTurns" class="flex flex-wrap gap-1.5">
        <button class="pill px-3 py-1 rounded-full active-gnc" data-turn="Todos">Todos</button>
        <button class="pill px-3 py-1 rounded-full" data-turn="MAÑANA">Mañana</button>
        <button class="pill px-3 py-1 rounded-full" data-turn="TARDE">Tarde</button>
        <button class="pill px-3 py-1 rounded-full" data-turn="NOCHE">Noche</button>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs font-semibold text-gray-400 w-24">PLAYERO:</span>
      <div id="filterWorkers" class="flex flex-wrap gap-1.5">
        <button class="pill px-3 py-1 rounded-full active-teal" data-worker="Todos">Todos</button>
      </div>
    </div>
  </div>

  <div id="metricsGrid" class="grid grid-cols-2 lg:grid-cols-6 gap-4 mb-6"></div>

  <div class="card p-3 border-amber-500/20 bg-amber-500/5 mb-6 text-xs flex items-center gap-2 text-amber-400">
    <span>🛡️</span>
    <p id="lblAlert">Validando consistencia de datos de planillas...</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
    <div class="card p-4 lg:col-span-2">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-300" id="lblChartMainTitle">Evolución Diaria</h3>
        <span class="text-[10px] bg-gray-800 text-blue-400 px-2 py-0.5 rounded-full" id="lblChartMainBadge">LINEAL</span>
      </div>
      <div class="h-64"><canvas id="chartMain"></canvas></div>
    </div>
    <div class="card p-4">
      <h3 class="text-xs font-bold uppercase tracking-wider text-gray-300 mb-4">Distribución de Ventas por Turno</h3>
      <div class="h-64"><canvas id="chartTurns"></canvas></div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="card p-4 lg:col-span-2">
      <h3 class="text-xs font-bold uppercase tracking-wider text-gray-300 mb-4" id="lblRankingTitle">Performance Prorrateada por Playero</h3>
      <div class="h-64"><canvas id="chartRanking"></canvas></div>
    </div>
    <div class="card p-4">
      <h3 class="text-xs font-bold uppercase tracking-wider text-gray-300 mb-4" id="lblChartSecTitle">Ventas Complementarias</h3>
      <div class="h-64"><canvas id="chartSecondary"></canvas></div>
    </div>
  </div>

</div>

<script>
const BASE_URL = "https://docs.google.com/spreadsheets/d/1Mi9g0qnBZRj70IdQl_6M1JxjMGRnyw1wOCh56D7cv64/gviz/tq?tqx=out:csv";
const URL_GNC = BASE_URL + "&sheet=Hoja%201";
const URL_LIQ = BASE_URL + "&sheet=Hoja%202%20liq";

let currentModule = 'GNC'; 
let rawGncData = [], rawLiqData = [];
let activeFilters = { month: 'CURSO', turn: 'Todos', worker: 'Todos' };
let charts = {};
let currentMonthLabelGlobal = "";

const COLORS = {
  blue: '#3b82f6', blueGlow: '#60a5fa', orange: '#ea580c', orangeGlow: '#f97316', teal: '#0d9488',
  chartSet: ['#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#14b8a6']
};

async function init() {
  setupEventListeners();
  await fetchData();
}

async function fetchData() {
  try {
    const [resGnc, resLiq] = await Promise.all([
      fetch(URL_GNC + "&cb=" + Date.now()).then(r => r.text()),
      fetch(URL_LIQ + "&cb=" + Date.now()).then(r => r.text())
    ]);

    rawGncData = Papa.parse(resGnc.trim(), { skipEmptyLines: true }).data;
    rawLiqData = Papa.parse(resLiq.trim(), { skipEmptyLines: true }).data;

    if (rawGncData.length && isNaN(parseRowDate(rawGncData[0][0]))) rawGncData.shift();
    if (rawLiqData.length && isNaN(parseRowDate(rawLiqData[0][0]))) rawLiqData.shift();

    buildMonthFilters();
    updateDashboard();
    
    const now = new Date();
    document.getElementById('lblUpdated').textContent = `Sincronizado: ${now.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'})}`;
  } catch (err) {
    console.error("Error cargando datos:", err);
  }
}

function parseRowDate(str) {
  if (!str) return NaN;
  const cleanStr = str.trim();
  const p = cleanStr.split('/');
  if (p.length === 3) {
    const year = p[2].length === 2 ? parseInt('20' + p[2]) : parseInt(p[2]);
    return new Date(year, parseInt(p[1]) - 1, parseInt(p[0]));
  }
  const d = cleanStr.split('-');
  if (d.length === 3) {
    return new Date(parseInt(d[0]), parseInt(d[1]) - 1, parseInt(d[2]));
  }
  return NaN;
}

function num(v) {
  if (!v) return 0;
  const n = parseFloat(String(v).replace(/\$/g, '').replace(/\./g, '').replace(',', '.').trim());
  return isNaN(n) ? 0 : n;
}

// LÓGICA DE DÍA CERRADO: Retorna objeto con fechas que tienen Mañana, Tarde y Noche cargados
function getClosedDaysMap(dataSrc) {
  const dayTurns = {};
  dataSrc.forEach(r => {
    const f = r[0] ? r[0].trim() : '';
    const t = r[1] ? r[1].toUpperCase().trim() : '';
    if (f && (t==='MAÑANA' || t==='TARDE' || t==='NOCHE')) {
      if (!dayTurns[f]) dayTurns[f] = new Set();
      dayTurns[f].add(t);
    }
  });
  const closedMap = {};
  for (const date in dayTurns) {
    closedMap[date] = dayTurns[date].has('MAÑANA') && dayTurns[date].has('TARDE') && dayTurns[date].has('NOCHE');
  }
  return closedMap;
}

// LÓGICA DE PRORRATEO OPERATIVO: Cuenta cuántos playeros hay por cada Fecha + Turno
function getProrrateoMap(dataSrc, closedMap) {
  const prorrateo = {};
  dataSrc.forEach(r => {
    const f = r[0] ? r[0].trim() : '';
    if (!closedMap[f]) return; // Ignorar si no está cerrado el día
    const t = r[1] ? r[1].toUpperCase().trim() : '';
    const p = r[2] ? r[2].trim() : '';
    if (f && t && p) {
      const key = `${f}_${t}`;
      if (!prorrateo[key]) prorrateo[key] = new Set();
      prorrateo[key].add(p);
    }
  });
  return prorrateo;
}

function buildMonthFilters() {
  const monthsDiv = document.getElementById('filterMonths');
  monthsDiv.innerHTML = '';
  
  const targetData = currentModule === 'GNC' ? rawGncData : rawLiqData;
  const closedMap = getClosedDaysMap(targetData);
  const uniqueMonths = new Set();
  
  let latestDate = null;
  
  targetData.forEach(r => {
    const d = parseRowDate(r[0]);
    if (!isNaN(d) && closedMap[r[0].trim()]) {
      let label = d.toLocaleDateString('es-AR', { month: 'short', year: '2-digit' }).replace('.', '').trim().toUpperCase();
      uniqueMonths.add(label);
      if (!latestDate || d > latestDate) {
        latestDate = d;
      }
    }
  });

  // Determinar la etiqueta del mes en curso real según planilla
  if (latestDate) {
    currentMonthLabelGlobal = latestDate.toLocaleDateString('es-AR', { month: 'short', year: '2-digit' }).replace('.', '').trim().toUpperCase();
  }

  // Píldora Mes en Curso
  const btnCurso = document.createElement('button');
  btnCurso.className = `pill px-3 py-1 rounded-full ${activeFilters.month === 'CURSO' ? (currentModule==='GNC'?'active-gnc':'active-liq') : ''}`;
  btnCurso.textContent = `MES EN CURSO (${currentMonthLabelGlobal || 'ACTUAL'})`;
  btnCurso.onclick = () => { selectFilter('month', 'CURSO'); };
  monthsDiv.appendChild(btnCurso);

  // Píldora Historial Completo (Todos)
  const btnAll = document.createElement('button');
  btnAll.className = `pill px-3 py-1 rounded-full ${activeFilters.month === 'TODOS' ? (currentModule==='GNC'?'active-gnc':'active-liq') : ''}`;
  btnAll.textContent = "HISTORIAL COMPLETO";
  btnAll.onclick = () => { selectFilter('month', 'TODOS'); };
  monthsDiv.appendChild(btnAll);

  // Píldoras de Historial por Mes individual
  Array.from(uniqueMonths).sort().forEach(m => {
    const btn = document.createElement('button');
    const isSelected = activeFilters.month === m;
    btn.className = `pill px-3 py-1 rounded-full ${isSelected ? (currentModule==='GNC'?'active-gnc':'active-liq') : ''}`;
    btn.textContent = m;
    btn.onclick = () => { selectFilter('month', m); };
    monthsDiv.appendChild(btn);
  });
}

function buildWorkerFilters(filteredRows) {
  const workersDiv = document.getElementById('filterWorkers');
  const currentSelection = activeFilters.worker;
  workersDiv.innerHTML = '';

  const workers = new Set();
  filteredRows.forEach(r => {
    if (r[2] && r[2].trim()) workers.add(r[2].trim());
  });

  const btnAll = document.createElement('button');
  btnAll.className = `pill px-3 py-1 rounded-full ${currentSelection === 'Todos' ? 'active-teal' : ''}`;
  btnAll.textContent = "Todos";
  btnAll.onclick = () => { selectFilter('worker', 'Todos'); };
  workersDiv.appendChild(btnAll);

  Array.from(workers).sort().forEach(w => {
    const btn = document.createElement('button');
    btn.className = `pill px-3 py-1 rounded-full ${currentSelection === w ? 'active-teal' : ''}`;
    btn.textContent = w;
    btn.onclick = () => { selectFilter('worker', w); };
    workersDiv.appendChild(btn);
  });
}

function selectFilter(type, value) {
  activeFilters[type] = value;
  const activeClass = currentModule === 'GNC' ? 'active-gnc' : 'active-liq';
  
  if (type === 'month') {
    buildMonthFilters(); // Reconstruye para refrescar estados visuales nativos
  }
  if (type === 'turn') {
    document.querySelectorAll('#filterTurns .pill').forEach(b => {
      b.classList.toggle(activeClass, b.getAttribute('data-turn') === value);
    });
  }
  updateDashboard();
}

function updateDashboard() {
  const isGnc = currentModule === 'GNC';
  const dataSrc = isGnc ? rawGncData : rawLiqData;
  
  const closedMap = getClosedDaysMap(dataSrc);
  const prorrateoMap = getProrrateoMap(dataSrc, closedMap);

  // 1. Filtrado de Base por Tiempo y Regla de Día Cerrado
  let baseRows = dataSrc.filter(r => {
    const f = r[0] ? r[0].trim() : '';
    if (!closedMap[f]) return false; // REGLA ESTRICTA DE DÍA CERRADO
    
    const d = parseRowDate(f);
    if (isNaN(d)) return false;
    
    if (activeFilters.month === 'TODOS') return true;
    
    let label = d.toLocaleDateString('es-AR', { month: 'short', year: '2-digit' }).replace('.', '').trim().toUpperCase();
    if (activeFilters.month === 'CURSO') {
      return label === currentMonthLabelGlobal;
    }
    return label === activeFilters.month.toUpperCase();
  });

  buildWorkerFilters(baseRows);

  // 2. Filtrado Secundario por parámetros de operación
  let displayRows = baseRows;
  if (activeFilters.turn !== 'Todos') {
    displayRows = displayRows.filter(r => r[1] && r[1].toUpperCase().trim() === activeFilters.turn.toUpperCase());
  }

  // Alerta Informativa Dinámica de Auditoría
  const modoTexto = activeFilters.month === 'CURSO' ? `MES EN CURSO (${currentMonthLabelGlobal})` : (activeFilters.month === 'TODOS' ? 'HISTORIAL CONSOLIDADO' : `AUDITANDO PERÍODO ${activeFilters.month}`);
  document.getElementById('lblAlert').textContent = `Filtro Activo: ${modoTexto} | Solo se computan datos de jornadas con Turno Noche cerrado.`;

  if (isGnc) {
    renderGncDashboard(displayRows, prorrateoMap);
  } else {
    renderLiquidosDashboard(displayRows, prorrateoMap);
  }
}

function renderGncDashboard(displayRows, prorrateoMap) {
  let totalM3 = 0, totalEfectivo = 0, aceites = 0, varios = 0, extraGnc = 0;
  const uniqueDays = new Set();
  
  // Procesamos filas aplicando el prorrateo si se filtra por playero
  displayRows.forEach(r => {
    const f = r[0].trim();
    const t = r[1].toUpperCase().trim();
    const p = r[2].trim();
    const key = `${f}_${t}`;
    const numPlayerosEnTurno = prorrateoMap[key] ? prorrateoMap[key].size : 1;

    if (activeFilters.worker !== 'Todos' && p !== activeFilters.worker) return;

    // Si filtramos por un playero, se le asigna solo su parte proporcional de la fila
    const factor = (activeFilters.worker !== 'Todos') ? (1 / numPlayerosEnTurno) : 1;

    totalM3 += num(r[3]) * factor;
    totalEfectivo += num(r[4]) * factor;
    aceites += num(r[5]) * factor; // CRÍTICO: División equitativa de aceites
    varios += num(r[6]) * factor;
    extraGnc += num(r[7]) * factor;
    uniqueDays.add(f);
  });

  // Si no se filtra playero, el total general real es la suma directa única de cada F+T para evitar duplicaciones
  if (activeFilters.worker === 'Todos') {
    totalM3 = 0; totalEfectivo = 0; aceites = 0; varios = 0; extraGnc = 0;
    const yaSumado = new Set();
    displayRows.forEach(r => {
      const idUnicoFila = `${r[0]}_${r[1]}_${r[3]}_${r[4]}`;
      if (!yaSumado.has(idUnicoFila)) {
        yaSumado.add(idUnicoFila);
        totalM3 += num(r[3]);
        totalEfectivo += num(r[4]);
        aceites += num(r[5]);
        varios += num(r[6]);
        extraGnc += num(r[7]);
      }
    });
  }

  const cantDias = uniqueDays.size || 1;
  const promedio = totalM3 / cantDias;

  const grid = document.getElementById('metricsGrid');
  grid.innerHTML = `
    <div class="card p-4 border-l-4 border-blue-500">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">M³ GNC VENTAS</p>
      <p class="text-xl font-black text-blue-400 mt-1">${Math.round(totalM3).toLocaleString('es-AR')}</p>
    </div>
    <div class="card p-4 border-l-4 border-emerald-500">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">EFECTIVO GNC</p>
      <p class="text-xl font-black text-emerald-400 mt-1">$ ${Math.round(totalEfectivo).toLocaleString('es-AR')}</p>
    </div>
    <div class="card p-4 border-l-4 border-teal-500">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">LUBRICANTES GNC</p>
      <p class="text-xl font-black text-teal-400 mt-1">$ ${Math.round(aceites).toLocaleString('es-AR')}</p>
    </div>
    <div class="card p-4 border-l-4 border-purple-500">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">VARIOS TIENDA</p>
      <p class="text-xl font-black text-purple-400 mt-1">$ ${Math.round(varios).toLocaleString('es-AR')}</p>
    </div>
    <div class="card p-4 border-l-4 border-amber-500">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">EXTRA GNC</p>
      <p class="text-xl font-black text-amber-500 mt-1">$ ${Math.round(extraGnc).toLocaleString('es-AR')}</p>
    </div>
    <div class="card p-4">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">PROM. JORNADA</p>
      <p class="text-xl font-black text-gray-200 mt-1">${Math.round(promedio).toLocaleString('es-AR')} m³</p>
    </div>
  `;

  document.getElementById('lblChartMainTitle').textContent = "Evolución Diaria Consolidada GNC (m³)";
  document.getElementById('lblRankingTitle').textContent = "Ranking de Performance Despachada (m³ Prorrateados)";
  document.getElementById('lblChartSecTitle').textContent = "Recaudación Efectivo por Turno ($)";

  // Gráfico lineal histórico agrupado por día
  const daysMap = {};
  displayRows.forEach(r => {
    const f = r[0].trim();
    if (activeFilters.worker !== 'Todos' && r[2].trim() !== activeFilters.worker) return;
    const key = `${f}_${r[1].toUpperCase().trim()}`;
    const numPlayerosEnTurno = prorrateoMap[key] ? prorrateoMap[key].size : 1;
    const factor = (activeFilters.worker !== 'Todos') ? (1 / numPlayerosEnTurno) : (1 / numPlayerosEnTurno);
    daysMap[f] = (daysMap[f] || 0) + (num(r[3]) * factor);
  });
  const labelsDates = Object.keys(daysMap).sort();
  const valuesM3 = labelsDates.map(k => daysMap[k]);

  renderMainLineChart(labelsDates, valuesM3, "M³ GNC", promedio, COLORS.blueGlow);
  renderTurnsChart(displayRows, 3, prorrateoMap); 
  renderRankingChart(displayRows, 3, prorrateoMap); 
  renderSecondaryBarChart(displayRows, 4, "Efectivo GNC $", prorrateoMap);
}

function renderLiquidosDashboard(displayRows, prorrateoMap) {
  let totalLitros = 0, heladera = 0, varios = 0, aceite = 0;
  const uniqueDays = new Set();

  displayRows.forEach(r => {
    const f = r[0].trim();
    const t = r[1].toUpperCase().trim();
    const p = r[2].trim();
    const key = `${f}_${t}`;
    const numPlayerosEnTurno = prorrateoMap[key] ? prorrateoMap[key].size : 1;

    if (activeFilters.worker !== 'Todos' && p !== activeFilters.worker) return;
    const factor = (activeFilters.worker !== 'Todos') ? (1 / numPlayerosEnTurno) : 1;

    heladera += num(r[4]) * factor;
    varios += num(r[5]) * factor;
    aceite += num(r[6]) * factor; // Prorrateo de lubricantes líquidos
    totalLitros += num(r[14]) * factor;
    uniqueDays.add(f);
  });

  if (activeFilters.worker === 'Todos') {
    totalLitros = 0; heladera = 0; varios = 0; aceite = 0;
    const yaSumado = new Set();
    displayRows.forEach(r => {
      const idUnicoFila = `${r[0]}_${r[1]}_${r[14]}`;
      if (!yaSumado.has(idUnicoFila)) {
        yaSumado.add(idUnicoFila);
        heladera += num(r[4]);
        varios += num(r[5]);
        aceite += num(r[6]);
        totalLitros += num(r[14]);
      }
    });
  }

  const cantDias = uniqueDays.size || 1;
  const promedioLts = totalLitros / cantDias;

  const grid = document.getElementById('metricsGrid');
  grid.innerHTML = `
    <div class="card p-4 border-l-4 border-orange-500">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">LTS COMBUSTIBLE</p>
      <p class="text-xl font-black text-orange-400 mt-1">${Math.round(totalLitros).toLocaleString('es-AR')} L</p>
    </div>
    <div class="card p-4 border-l-4 border-amber-500">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">TIENDA HELADERA</p>
      <p class="text-xl font-black text-amber-400 mt-1">$ ${Math.round(heladera).toLocaleString('es-AR')}</p>
    </div>
    <div class="card p-4 border-l-4 border-yellow-500">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">VARIOS SHOP</p>
      <p class="text-xl font-black text-yellow-400 mt-1">$ ${Math.round(varios).toLocaleString('es-AR')}</p>
    </div>
    <div class="card p-4 border-l-4 border-teal-500">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">LUBRICANTES LIQ.</p>
      <p class="text-xl font-black text-teal-400 mt-1">${Math.round(aceite).toLocaleString('es-AR')} L</p>
    </div>
    <div class="card p-4 border-l-4 border-gray-600">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">DÍAS CONSOLIDADO</p>
      <p class="text-xl font-black text-gray-300 mt-1">${cantDias}</p>
    </div>
    <div class="card p-4">
      <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">PROM. DESPACHO</p>
      <p class="text-xl font-black text-purple-400 mt-1">${Math.round(promedioLts).toLocaleString('es-AR')} L</p>
    </div>
  `;

  document.getElementById('lblChartMainTitle').textContent = "Evolución Combustibles Líquidos (Litros)";
  document.getElementById('lblRankingTitle').textContent = "Ranking de Despacho Líquidos (Litros Prorrateados)";
  document.getElementById('lblChartSecTitle').textContent = "Ingresos del Shop (Heladera $)";

  const daysMap = {};
  displayRows.forEach(r => {
    const f = r[0].trim();
    if (activeFilters.worker !== 'Todos' && r[2].trim() !== activeFilters.worker) return;
    const key = `${f}_${r[1].toUpperCase().trim()}`;
    const numPlayerosEnTurno = prorrateoMap[key] ? prorrateoMap[key].size : 1;
    const factor = (activeFilters.worker !== 'Todos') ? (1 / numPlayerosEnTurno) : (1 / numPlayerosEnTurno);
    daysMap[f] = (daysMap[f] || 0) + (num(r[14]) * factor);
  });
  const labelsDates = Object.keys(daysMap).sort();
  const valuesLts = labelsDates.map(k => daysMap[k]);

  renderMainLineChart(labelsDates, valuesLts, "Litros Combustible", promedioLts, COLORS.orangeGlow);
  renderTurnsChart(displayRows, 14, prorrateoMap); 
  renderRankingChart(displayRows, 14, prorrateoMap); 
  renderSecondaryBarChart(displayRows, 4, "Heladera $", prorrateoMap); 
}

function destroyChart(id) { if (charts[id]) { charts[id].destroy(); } }

const baseChartOptions = {
  responsive: true, maintainAspectRatio: false,
  plugins: { legend: { labels: { color: '#9ca3af', font: { size: 10 } } } },
  scales: {
    x: { ticks: { color: '#6b7280', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.01)' } },
    y: { ticks: { color: '#6b7280', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.02)' } }
  }
};

function renderMainLineChart(labels, dataValues, datasetLabel, average, colorGlow) {
  destroyChart('main');
  const ctx = document.getElementById('chartMain').getContext('2d');
  charts.main = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels.map(l => l.split('/')[0] + '/' + l.split('/')[1]),
      datasets: [
        { label: datasetLabel, data: dataValues, borderColor: colorGlow, backgroundColor: 'rgba(59,130,246,0.02)', fill: true, tension: 0.1, borderWidth: 2 },
        { label: 'Media del Período', data: dataValues.map(() => average), borderColor: COLORS.orange, borderDash: [5, 5], pointRadius: 0, borderWidth: 1 }
      ]
    },
    options: baseChartOptions
  });
}

function renderTurnsChart(rows, dataColIdx, prorrateoMap) {
  destroyChart('turns');
  const turnsMap = { 'MAÑANA': 0, 'TARDE': 0, 'NOCHE': 0 };
  
  rows.forEach(r => {
    const f = r[0].trim();
    const t = r[1].toUpperCase().trim();
    if (activeFilters.worker !== 'Todos' && r[2].trim() !== activeFilters.worker) return;
    
    const key = `${f}_${t}`;
    const numPlayerosEnTurno = prorrateoMap[key] ? prorrateoMap[key].size : 1;
    const factor = (activeFilters.worker !== 'Todos') ? (1 / numPlayerosEnTurno) : (1 / numPlayerosEnTurno);

    if (turnsMap[t] !== undefined) turnsMap[t] += num(r[dataColIdx]) * factor;
  });

  const ctx = document.getElementById('chartTurns').getContext('2d');
  charts.turns = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: Object.keys(turnsMap),
      datasets: [{
        data: Object.values(turnsMap),
        backgroundColor: ['#1d4ed8', '#ea580c', '#6d28d9'],
        borderWidth: 0
      }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#9ca3af', font: { size: 10 } } } } }
  });
}

function renderRankingChart(rows, dataColIdx, prorrateoMap) {
  destroyChart('ranking');
  const rank = {};
  
  rows.forEach(r => {
    const f = r[0].trim();
    const t = r[1].toUpperCase().trim();
    const p = (r[2] || '').trim();
    if (!p) return;
    
    const key = `${f}_${t}`;
    const numPlayerosEnTurno = prorrateoMap[key] ? prorrateoMap[key].size : 1;
    // LÓGICA CLAVE: Cada fila se divide por los playeros que compartieron el bloque
    const valorProrrateado = num(r[dataColIdx]) / numPlayerosEnTurno;

    if (activeFilters.worker !== 'Todos' && p !== activeFilters.worker) return;
    rank[p] = (rank[p] || 0) + valorProrrateado;
  });

  const sorted = Object.entries(rank).sort((a, b) => b[1] - a[1]);
  const ctx = document.getElementById('chartRanking').getContext('2d');
  charts.ranking = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: sorted.map(e => e[0]),
      datasets: [{
        label: 'Volumen Asignado',
        data: sorted.map(e => Math.round(e[1])),
        backgroundColor: COLORS.chartSet,
        borderRadius: 4
      }]
    },
    options: { indexAxis: 'y', ...baseChartOptions, plugins: { legend: { display: false } } }
  });
}

function renderSecondaryBarChart(rows, dataColIdx, labelName, prorrateoMap) {
  destroyChart('secondary');
  const turnsMap = { 'MAÑANA': 0, 'TARDE': 0, 'NOCHE': 0 };
  
  rows.forEach(r => {
    const f = r[0].trim();
    const t = r[1].toUpperCase().trim();
    if (activeFilters.worker !== 'Todos' && r[2].trim() !== activeFilters.worker) return;
    
    const key = `${f}_${t}`;
    const numPlayerosEnTurno = prorrateoMap[key] ? prorrateoMap[key].size : 1;
    const factor = (activeFilters.worker !== 'Todos') ? (1 / numPlayerosEnTurno) : (1 / numPlayerosEnTurno);

    if (turnsMap[t] !== undefined) turnsMap[t] += num(r[dataColIdx]) * factor;
  });

  const ctx = document.getElementById('chartSecondary').getContext('2d');
  charts.secondary = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: Object.keys(turnsMap),
      datasets: [{
        label: labelName,
        data: Object.values(turnsMap),
        backgroundColor: ['#2563eb', '#f59e0b', '#7c3aed'],
        borderRadius: 4
      }]
    },
    options: { ...baseChartOptions, plugins: { legend: { display: false } } }
  });
}

function resetTabFilters() {
  activeFilters.month = 'CURSO'; 
  activeFilters.turn = 'Todos';
  activeFilters.worker = 'Todos';
  
  const activeClass = currentModule === 'GNC' ? 'active-gnc' : 'active-liq';
  document.querySelectorAll('#filterTurns .pill').forEach(b => {
    b.className = `pill px-3 py-1 rounded-full ${b.getAttribute('data-turn') === 'Todos' ? activeClass : ''}`;
  });
}

function setupEventListeners() {
  document.getElementById('btnModGnc').addEventListener('click', () => {
    currentModule = 'GNC';
    resetTabFilters();
    document.getElementById('lblMainHeading').textContent = "Dashboard de ventas · GNC";
    document.getElementById('brandBadge').className = "w-10 h-10 rounded-lg bg-blue-600/10 border border-blue-500/30 flex items-center justify-center font-bold text-blue-400 text-xs";
    document.getElementById('btnModGnc').className = "py-2.5 font-bold rounded-lg text-center border transition text-xs tracking-wider uppercase bg-blue-600 border-blue-500 text-white shadow-lg shadow-blue-500/10";
    document.getElementById('btnModLiq').className = "py-2.5 font-bold rounded-lg text-center border transition text-xs tracking-wider uppercase bg-gray-800 border-gray-700 text-gray-400 hover:text-white";
    buildMonthFilters();
    updateDashboard();
  });

  document.getElementById('btnModLiq').addEventListener('click', () => {
    currentModule = 'LIQUIDOS';
    resetTabFilters();
    document.getElementById('lblMainHeading').textContent = "Dashboard de ventas · Líquidos y Shop";
    document.getElementById('brandBadge').className = "w-10 h-10 rounded-lg bg-orange-600/10 border border-orange-500/30 flex items-center justify-center font-bold text-orange-400 text-xs";
    document.getElementById('btnModLiq').className = "py-2.5 font-bold rounded-lg text-center border transition text-xs tracking-wider uppercase bg-orange-600 border-orange-500 text-white shadow-lg shadow-orange-500/10";
    document.getElementById('btnModGnc').className = "py-2.5 font-bold rounded-lg text-center border transition text-xs tracking-wider uppercase bg-gray-800 border-gray-700 text-gray-400 hover:text-white";
    buildMonthFilters();
    updateDashboard();
  });

  document.getElementById('btnRefresh').addEventListener('click', fetchData);
}

window.onload = init;
</script>
